services:
  - type: web
    name: tourgenie-app
    runtime: static
    staticPublishPath: ./dist
    buildCommand: npm install && npm run build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: API_KEY
        placeholder: "Enter your Google Gemini API Key"
        description: "Required for Gemini 3 and Veo video generation models."