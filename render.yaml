services:
  - type: web
    name: tourgenie-app
    runtime: static
    staticPublishPath: ./dist
    buildCommand: "npm run build && if [ -n \"$API_KEY\" ]; then sed -i 's|RENDER_API_KEY_PLACEHOLDER|'\"$API_KEY\"'|g' dist/index.html; fi"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_KEY
        placeholder: "Enter your Google Gemini API Key"
        description: "Required for Gemini 3 and Veo video generation models."